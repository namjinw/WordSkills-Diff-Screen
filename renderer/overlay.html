<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self' file:">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  .layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  #photo { opacity: .5; }
  #diff { display: none; }
  #divider { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 4px #000; display: none; pointer-events: none; }
  #hud { position: absolute; inset: 0; width: 100%; height: 100%; }
  #badge { position: absolute; left: 22px; top: 22px; padding: 4px 9px; border-radius: 6px; background: rgba(0,0,0,.72); color: #fff;
    font: 700 13px 'Malgun Gothic', sans-serif; pointer-events: none; line-height: 1.35; white-space: pre; }
</style></head>
<body>
<img id="photo" class="layer" alt="">
<img id="diff" class="layer" alt="">
<div id="divider"></div>
<canvas id="hud"></canvas>
<div id="badge">일치도 --%</div>
<script src="overlay.js"></script></body></html>
